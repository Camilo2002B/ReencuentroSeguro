<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Concepto: app móvil de barrio. Verde café como base, tres colores de señal fijos por tipo de reporte
   (perdida = rojo, encontrada = azul, avistamiento = violeta). Navegación inferior, tarjetas planas con línea fina. */
:root{
  --bg:#F2F6F3; --surface:#FFFFFF; --surface-2:#E7EEE9; --ink:#10231D; --ink-2:#4B6058; --line:#D2DCD6;
  --brand:#0B6B52; --brand-ink:#FFFFFF; --brand-soft:#D5EAE1;
  --lost:#B93626; --lost-soft:#F8DCD6; --found:#1F5FA8; --found-soft:#D8E6F6; --seen:#6F44AB; --seen-soft:#E7DCF4;
  --warn:#8A5700; --warn-soft:#FAEBC9; --ok:#1B7338; --ok-soft:#D8EFDE;
  --shadow:0 1px 2px rgba(16,35,29,.08),0 10px 28px rgba(16,35,29,.06);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1411; --surface:#13201B; --surface-2:#1B2C25; --ink:#E6F0EB; --ink-2:#9FB4AA; --line:#28413A;
    --brand:#3FC79F; --brand-ink:#05251B; --brand-soft:#17392F;
    --lost:#FF8E7C; --lost-soft:#401E19; --found:#80B6F3; --found-soft:#152B46; --seen:#C3A0F2; --seen-soft:#2B2042;
    --warn:#F2B84B; --warn-soft:#3B2D10; --ok:#72D590; --ok-soft:#14341F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1411; --surface:#13201B; --surface-2:#1B2C25; --ink:#E6F0EB; --ink-2:#9FB4AA; --line:#28413A;
  --brand:#3FC79F; --brand-ink:#05251B; --brand-soft:#17392F;
  --lost:#FF8E7C; --lost-soft:#401E19; --found:#80B6F3; --found-soft:#152B46; --seen:#C3A0F2; --seen-soft:#2B2042;
  --warn:#F2B84B; --warn-soft:#3B2D10; --ok:#72D590; --ok-soft:#14341F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.shell{max-width:720px;margin:0 auto;padding-bottom:104px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{flex:1}
.muted{color:var(--ink-2)} .small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* barra superior */
.top{display:flex;align-items:center;gap:12px;padding:16px 0 8px}
.logo{width:40px;height:40px;flex:none}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.2rem;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.75rem;letter-spacing:0;color:var(--ink-2);margin-top:4px}

/* navegación inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-size:.72rem;font-weight:500;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.tab.pub{color:var(--brand-ink);background:var(--brand);font-weight:600}
.tab.pub[aria-current="page"]{outline:2px solid var(--ink);outline-offset:-2px}
.badge-n{position:absolute;top:2px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--lost);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:transparent;color:var(--lost);border-color:var(--lost)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.lost{background:var(--lost-soft);color:var(--lost)} .pill.found{background:var(--found-soft);color:var(--found)} .pill.seen{background:var(--seen-soft);color:var(--seen)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);font-size:.9rem}
.notice.info{background:var(--found-soft)} .notice.good{background:var(--ok-soft)} .notice.bad{background:var(--lost-soft)}
.notice b{font-weight:600}

.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:1.65rem;font-weight:800}
.hero p{opacity:.92}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.16);color:inherit;text-decoration:none;font-weight:600;font-size:.82rem;border:1px solid rgba(255,255,255,.28)}
.quick a:hover{background:rgba(255,255,255,.26)}
.quick svg{width:26px;height:26px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quick a{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.3)}}
:root[data-theme="dark"] .quick a{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.3)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink-2)}

.filters{display:flex;flex-direction:column;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:.88rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.84rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--ink-2)}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:92px;resize:vertical}
select{appearance:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;font-size:.84rem;font-weight:600;margin-bottom:6px}
.tipo-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tipo-opts label{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:12px 6px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:600;font-size:.84rem;background:var(--surface)}
.tipo-opts input{position:absolute;opacity:0;pointer-events:none}
.tipo-opts label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.tipo-opts label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.tipo-opts svg{width:28px;height:28px}

/* lista de reportes */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--brand)}
.item .ph{width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:block}
.item .ph img,.item .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.item h3{font-size:1rem}
.item .meta{font-size:.82rem;color:var(--ink-2)}
.item .txt{font-size:.88rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty svg{width:56px;height:56px;margin-bottom:8px;color:var(--ink-2)}

/* detalle */
.detail-ph{width:100%;aspect-ratio:4/3;max-height:340px;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.detail-ph img,.detail-ph svg{width:100%;height:100%;object-fit:cover;display:block}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:.92rem;margin:0}
.dl dt{color:var(--ink-2)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tl li{position:relative;padding:0 0 14px 22px;font-size:.9rem}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl li::after{content:"";position:absolute;left:9px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:.78rem;color:var(--ink-2)}
.match{display:flex;gap:10px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:12px;text-decoration:none;color:inherit}
.match .ph{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex:none}
.match .ph svg,.match .ph img{width:100%;height:100%;object-fit:cover}

/* mapa por zonas */
.zmap{display:grid;grid-template-columns:1fr 1.2fr 1fr;grid-template-areas:". norte ." "occ centro ori" ". sur .";gap:8px}
.zone{border:1px solid var(--line);border-radius:18px;padding:12px 8px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--ink);background:var(--surface)}
.zone b{font-family:var(--font-display);font-size:1rem}
.zone .n{font-size:1.9rem;font-family:var(--font-display);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.zone .dots{display:flex;gap:8px;font-size:.78rem;font-variant-numeric:tabular-nums}
.d{display:inline-flex;align-items:center;gap:3px}
.d::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.d.lost{color:var(--lost)} .d.found{color:var(--found)} .d.seen{color:var(--seen)}
.z-norte{grid-area:norte}.z-occ{grid-area:occ}.z-centro{grid-area:centro}.z-ori{grid-area:ori}.z-sur{grid-area:sur}

/* panel y métricas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:8px;align-items:center;font-size:.84rem}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.bar .tr{background:var(--surface-2);border-radius:6px;overflow:hidden}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.subtabs .chip{flex:none}
.scale{display:flex;gap:6px}
.scale label{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 0;cursor:pointer;background:var(--surface);font-weight:600}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.scale label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.menu{display:flex;flex-direction:column}
.menu a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-weight:500}
.menu a:last-child{border-bottom:0}
.menu svg{width:22px;height:22px;color:var(--brand);flex:none}
.photo-prev{max-width:180px;border-radius:12px;display:block;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30;max-width:min(92vw,520px);box-shadow:var(--shadow)}
ul.clean{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
.scroll-x{overflow-x:auto}
@media (max-width:420px){.dl{grid-template-columns:92px 1fr}.bar{grid-template-columns:100px 1fr 26px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
#auth-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.auth-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
</style>

<script>
(function(){

var COLOR_CORTO={negro:'negro',blanco:'blanco',cafe:'café',beige:'beige',gris:'gris',naranja:'naranja',manchado:'manchado'};

var ESTADOS_POR_TIPO={perdida:['nuevo','en_busqueda','avistamiento','resguardo','reunido','cerrado'],encontrada:['nuevo','resguardo','reunido','cerrado']};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nid(){var a='abcdefghijkmnpqrstuvwxyz23456789',s='',r=crypto.getRandomValues(new Uint8Array(10));for(var i=0;i<r.length;i++)s+=a[r[i]%a.length];return s}

function fechaDia(f){if(!f)return '';var p=f.split('-');if(p.length<3)return f;try{return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})}catch(e){return f}}
function rel(iso){var t=Date.parse(iso);if(isNaN(t))return '';var m=Math.round((Date.now()-t)/60000);if(m<2)return 'hace un momento';if(m<60)return 'hace '+m+' min';var h=Math.round(m/60);if(h<24)return 'hace '+h+' h';var d=Math.round(h/24);if(d<31)return 'hace '+d+(d===1?' día':' días');return fechaLarga(iso)}

function telOk(s){var d=digits(s);return (d.length===10&&d[0]==='3')||(d.length===12&&d.slice(0,2)==='57')}

/* ---------- normalización y consultas ---------- */
function titulo(it){
  if(it.kind==='avistamiento')return 'Avistamiento: '+especieL(it.especie).toLowerCase()+' '+(COLOR_CORTO[it.color]||'');
  return (it.nombre?it.nombre+' · ':'')+especieL(it.especie)+' '+(COLOR_CORTO[it.color]||'');
}
function ubic(it){var p=[];if(it.barrio)p.push(it.barrio);if(it.sector&&it.municipio==='Armenia')p.push('sector '+it.sector);p.push(it.municipio);return p.join(', ')}
function normCaso(c){var o=Object.assign({},c);o.kind=c.tipo;o.ref='caso-'+c.id;return o}
function normAv(a){var o=Object.assign({},a);o.kind='avistamiento';o.ref='vista-'+a.id;o.estado='avistamiento';o.senas=a.nota;return o}
function activo(it){if(it.kind==='avistamiento')return Date.now()-evTs(it)<21*86400000;return INACTIVOS.indexOf(it.estado)<0}
function casosVisibles(){return store.casos.filter(function(c){return c.moderacion==='aprobado'||c.creadoPor===store.uid||store.admin})}
function todosItems(){
  var a=casosVisibles().map(normCaso);
  store.avist.filter(function(v){return !v.casoId}).forEach(function(v){a.push(normAv(v))});
  return a.sort(function(x,y){return evTs(y)-evTs(x)});
}
function itemsActivosPublicos(){return todosItems().filter(function(it){return (it.kind==='avistamiento'||it.moderacion==='aprobado')&&activo(it)})}
/* el mapa cuenta lo público y también los reportes propios que aún están en revisión */
function itemsMapa(){return todosItems().filter(function(it){return activo(it)&&(it.kind==='avistamiento'||it.moderacion==='aprobado'||(esMio(it)&&it.moderacion!=='rechazado'))})}
function buscar(ref){
  if(ref.indexOf('caso-')===0){var id=ref.slice(5);var c=store.casos.filter(function(x){return x.id===id})[0];return c?normCaso(c):null}
  if(ref.indexOf('vista-')===0){var id2=ref.slice(6);var v=store.avist.filter(function(x){return x.id===id2})[0];return v?normAv(v):null}
  return null;
}
function esMio(it){return it.creadoPor&&it.creadoPor===store.uid}
function avistDe(casoId){return store.avist.filter(function(v){return v.casoId===casoId}).sort(function(a,b){return Date.parse(b.creadoEn)-Date.parse(a.creadoEn)})}

function coincidencias(base){
  var cand=[];
  if(base.kind==='perdida'){cand=todosItems().filter(function(i){return (i.kind==='encontrada'||i.kind==='avistamiento')&&activo(i)&&(i.kind==='avistamiento'?!i.casoId:i.moderacion==='aprobado')})}
  else{cand=todosItems().filter(function(i){return i.kind==='perdida'&&activo(i)&&i.moderacion==='aprobado'})}
  var res=[];
  cand.forEach(function(c){
    if(c.id===base.id||c.especie!==base.especie)return;
    var s=0;
    if(c.color===base.color)s+=3;
    if(c.municipio===base.municipio&&c.sector&&c.sector===base.sector)s+=2;
    if(c.tamano&&c.tamano===base.tamano)s+=1;
    if(Math.abs(evTs(c)-evTs(base))<=14*86400000)s+=1;
    if(s>=4)res.push({it:c,s:s});
  });
  return res.sort(function(a,b){return b.s-a.s}).slice(0,3);
}

function aplicarFiltros(items){
  var f=ui.f,q=f.q.trim().toLowerCase();
  return items.filter(function(it){
    if(f.tipo!=='todos'&&it.kind!==f.tipo)return false;
    if(f.especie!=='todas'&&it.especie!==f.especie)return false;
    if(f.sector!=='todos'&&(it.sector!==f.sector||it.municipio!=='Armenia'))return false;
    if(f.estado==='activos'&&!activo(it))return false;
    if(f.estado==='reunidos'&&it.estado!=='reunido')return false;
    if(f.dias!=='todos'&&Date.now()-evTs(it)>(+f.dias)*86400000)return false;
    if(q){var hay=[it.nombre,it.senas,it.barrio,it.sector,COLOR_CORTO[it.color],COLORES[it.color]&&COLORES[it.color][0],especieL(it.especie),it.municipio].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
}

/* mapa */
function viewMapa(){
  var items=itemsMapa(),porSector={};
  SECTORES.forEach(function(s){porSector[s]={lost:0,found:0,seen:0}});
  var otros={};
  items.forEach(function(i){
    if(i.municipio==='Armenia'&&porSector[i.sector]){porSector[i.sector][TIPO_CLASE[i.kind]]++}
    else if(i.municipio!=='Armenia'){otros[i.municipio]=(otros[i.municipio]||0)+1}
  });
  var tot=function(s){var p=porSector[s];return p.lost+p.found+p.seen},max=Math.max(1,Math.max.apply(null,SECTORES.map(tot)));
  var cls={Centro:'z-centro',Norte:'z-norte',Sur:'z-sur',Oriente:'z-ori',Occidente:'z-occ'};
  var h='<div class="stack">'+banner()+'<div><h2>Mapa por zonas</h2><p class="muted">Esquema de Armenia por sectores. Muestra reportes activos sin revelar direcciones exactas. Toca un sector para ver sus casos.</p></div>';
  h+='<div class="zmap" role="group" aria-label="Sectores de Armenia">'+SECTORES.map(function(s){var p=porSector[s],n=tot(s);
    return '<button type="button" class="zone '+cls[s]+'" data-act="sector" data-s="'+s+'" style="background:color-mix(in srgb,var(--brand) '+Math.round(8+n/max*42)+'%,var(--surface))" aria-label="'+s+': '+n+' reportes activos">'
     +'<b>'+s+'</b><span class="n">'+n+'</span><span class="dots"><span class="d lost" title="Perdidas">'+p.lost+'</span><span class="d found" title="Encontradas">'+p.found+'</span><span class="d seen" title="Avistamientos">'+p.seen+'</span></span></button>'}).join('')+'</div>';
  h+='<div class="row small muted"><span class="d lost">Perdidas</span><span class="d found">Encontradas</span><span class="d seen">Avistamientos</span></div>';
  var ks=Object.keys(otros);

/* moderación */
function isAdminView(){return store.admin&&cloud()}
function ownerContact(casoId){
  for(var i=0;i<store.buzon.length;i++){var its=store.buzon[i].items;for(var j=0;j<its.length;j++){if(its[j].tipo==='contacto'&&its[j].casoId===casoId)return its[j].contacto}}

}
function viewMod(){
  if(!isAdminView())return '<div class="stack">'+banner()+'<div class="card empty">'+IC.candado+'<h3>Solo para moderadores</h3><p>Este panel está disponible para quien administra la página.</p></div></div>';
  var tabs=[['pendientes','Pendientes'],['mensajes','Mensajes'],['metricas','Métricas'],['opiniones','Opiniones'],['datos','Datos']];
  var h='<div class="stack">'+banner()+'<a href="#mas" class="small">← Volver</a><h2>Panel de moderación</h2><div class="subtabs" role="tablist">'+tabs.map(function(t){return '<button type="button" class="chip" data-act="modtab" data-t="'+t[0]+'" aria-pressed="'+(ui.modTab===t[0])+'">'+t[1]+(t[0]==='pendientes'?' ('+store.casos.filter(function(c){return c.moderacion==='pendiente'}).length+')':'')+'</button>'}).join('')+'</div>';
  if(ui.modTab==='pendientes')h+=modPendientes();
  else if(ui.modTab==='mensajes')h+=modMensajes();

  else if(ui.modTab==='opiniones')h+=modOpiniones();
  else h+=modDatos();
  return h+'</div>';
}
function modPendientes(){
  var p=store.casos.filter(function(c){return c.moderacion==='pendiente'}).sort(function(a,b){return Date.parse(a.creadoEn)-Date.parse(b.creadoEn)});
  if(!p.length)return '<div class="card empty">'+IC.vacio+'<h3>Nada por revisar</h3><p>Los reportes nuevos aparecen aquí antes de publicarse.</p></div>';
  return '<div class="list">'+p.map(function(c){var it=normCaso(c);return '<div class="card stack">'+cardItem(it)+'<p class="small muted">Revisa que no incluya teléfonos, direcciones exactas ni datos de terceros.</p><div class="row"><button class="btn sm" data-act="moderar" data-id="'+esc(c.id)+'" data-d="aprobado">Aprobar</button><button class="btn sm danger" data-act="moderar" data-id="'+esc(c.id)+'" data-d="rechazado">Rechazar</button></div></div>'}).join('')+'</div>';
}
function modMensajes(){
  var msgs=[];
  store.buzon.forEach(function(b){b.items.forEach(function(i){if(i.tipo==='mensaje')msgs.push(i)})});
  msgs.sort(function(a,b){return Date.parse(b.ts)-Date.parse(a.ts)});
  if(!msgs.length)return '<div class="card empty">'+IC.vacio+'<h3>Sin mensajes</h3><p>Aquí llegan los mensajes de “Contactar de forma segura”.</p></div>';
  return '<p class="small muted">Tú haces de puente: avisa a la familia por WhatsApp y confirma con la persona que escribió. Los teléfonos nunca se publican.</p><div class="list">'+msgs.map(function(m){
    var c=store.casos.filter(function(x){return x.id===m.casoId})[0],it=c?normCaso(c):null,dueno=ownerContact(m.casoId),hecho=!!handled[m.id];
    var textoFam='Hola, desde Reencuentro Seguro: alguien escribió sobre tu caso ('+(it?titulo(it):'')+'). Mensaje: '+m.texto;
    return '<div class="card stack"><div class="row"><b>'+(it?esc(titulo(it)):'Caso eliminado')+'</b><span class="sp"></span><span class="small muted">'+esc(rel(m.ts))+'</span>'+(hecho?'<span class="pill ok">Gestionado</span>':'')+'</div>'
     +'<p>'+esc(m.texto)+'</p><p class="small muted">Celular de quien escribió: <b>'+esc(m.contacto||'—')+'</b> · Celular de la familia: <b>'+esc(dueno||'sin registrar')+'</b></p>'
     +'<div class="row">'+(dueno&&telOk(dueno)?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+telWa(dueno)+'?text='+encodeURIComponent(textoFam)+'">Avisar a la familia</a>':'')
     +(m.contacto&&telOk(m.contacto)?'<a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/'+telWa(m.contacto)+'">Responder a quien escribió</a>':'')
     +(hecho?'':'<button class="btn sm ghost" data-act="gestionado" data-id="'+esc(m.id)+'">Marcar gestionado</button>')+'</div></div>'}).join('')+'</div>';
}
function bar(label,n,max){return '<div class="bar"><span>'+esc(label)+'</span><span class="tr"><i style="width:'+(max?Math.round(n/max*100):0)+'%"></i></span><b>'+n+'</b></div>'}
function modMetricas(){
  var reales=store.casos.filter(function(c){return !c.ejemplo&&c.moderacion==='aprobado'}),av=store.avist.filter(function(v){return !v.ejemplo});
  var ej=store.casos.filter(function(c){return c.ejemplo}).length+store.avist.filter(function(v){return v.ejemplo}).length;
  var act=reales.filter(function(c){return INACTIVOS.indexOf(c.estado)<0}).length;
  var reun=reales.filter(function(c){return c.estado==='reunido'}).length;
  var upd=reales.filter(function(c){return Date.now()-Date.parse(c.creadoEn)>0&&((c.historial||[]).length>1||avistDe(c.id).length>0)}).length;
  var horas=[];reales.forEach(function(c){var a=avistDe(c.id);if(a.length){var t=Math.min.apply(null,a.map(function(v){return Date.parse(v.creadoEn)}));horas.push((t-Date.parse(c.creadoEn))/3600000)}});
  var tprom=horas.length?(horas.reduce(function(a,b){return a+b},0)/horas.length):null;
  var usuarios={};reales.forEach(function(c){usuarios[c.creadoPor]=1});av.forEach(function(v){usuarios[v.creadoPor]=1});store.opiniones.forEach(function(o){if(o.creadoPor)usuarios[o.creadoPor]=1});
  var k=function(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>'};
  var porEstado={};reales.forEach(function(c){porEstado[c.estado]=(porEstado[c.estado]||0)+1});
  var maxE=Math.max.apply(null,[1].concat(Object.keys(porEstado).map(function(e){return porEstado[e]})));
  return '<div class="notice info small">Las métricas usan solo datos reales. Se excluyen '+ej+' registros de ejemplo.</div><div class="kpis">'
   +k(reales.length,'casos publicados')+k(act,'casos activos')+k(av.length,'avistamientos')+k(reun,'reencuentros confirmados')
   +k(reales.length?Math.round(upd/reales.length*100)+'%':'—','casos con novedades')+k(tprom==null?'—':(tprom<1?'<1 h':tprom.toFixed(1)+' h'),'tiempo a la 1.ª pista')+k(Object.keys(usuarios).length,'usuarios activos')+k(store.opiniones.length,'opiniones recibidas')+'</div>'
   +'<section class="card stack"><h3>Casos por estado</h3><div class="bars">'+(Object.keys(porEstado).length?Object.keys(ESTADOS).filter(function(e){return porEstado[e]}).map(function(e){return bar(ESTADOS[e],porEstado[e],maxE)}).join(''):'<p class="muted">Aún no hay casos reales.</p>')+'</div></section>';
}
function modOpiniones(){
  var os=store.opiniones.slice().sort(function(a,b){return Date.parse(b.creadoEn)-Date.parse(a.creadoEn)});
  if(!os.length)return '<div class="card empty">'+IC.vacio+'<h3>Aún no hay opiniones</h3><p>Comparte la página con tus usuarios de prueba y pídeles completar “Tu opinión” desde Más.</p></div>';
  var n=os.length,avg=function(f){var v=os.filter(function(o){return typeof o[f]==='number'});return v.length?(v.reduce(function(a,o){return a+o[f]},0)/v.length).toFixed(1):'—'};
  var pct=function(t){return Math.round(os.filter(function(o){return o.tareas&&o.tareas[t]}).length/n*100)};
  var cnt=function(f,v){return os.filter(function(o){return o[f]===v}).length};
  return '<div class="kpis"><div class="stat"><b>'+n+'</b><span>participantes</span></div><div class="stat"><b>'+avg('claridad')+'</b><span>claridad (1-5)</span></div><div class="stat"><b>'+avg('confianza')+'</b><span>confianza (1-5)</span></div><div class="stat"><b>'+avg('utilidad')+'</b><span>utilidad (1-5)</span></div></div>'
   +'<section class="card stack"><h3>Tareas completadas sin ayuda</h3><div class="bars">'+bar('Publicar',pct('publicar'),100)+bar('Buscar',pct('buscar'),100)+bar('Avistamiento',pct('avistamiento'),100)+bar('Cerrar caso',pct('cerrar'),100)+'</div><p class="small muted">Porcentaje de participantes. Meta del plan de validación: al menos 70 % en los flujos centrales.</p></section>'
   +'<section class="card stack"><h3>Intención de uso</h3><p>Sí: '+cnt('usaria','si')+' · Depende: '+cnt('usaria','depende')+' · No: '+cnt('usaria','no')+'</p></section>'
   +'<section class="card stack"><h3>Comentarios</h3><ul class="clean">'+os.filter(function(o){return o.comentario}).slice(0,12).map(function(o){return '<li>'+esc(o.comentario)+'</li>'}).join('')+'</ul></section>'
   +'<button class="btn" data-act="csv">Descargar resultados (CSV)</button>';
}
function modDatos(){
  var ej=store.casos.filter(function(c){return c.ejemplo}).length+store.avist.filter(function(v){return v.ejemplo}).length;
  return '<section class="card stack"><h3>Datos de ejemplo</h3><p class="small muted">Sirven para mostrar la app antes de tener usuarios. No cuentan en las métricas. Actualmente hay '+ej+' registros de ejemplo.</p><div class="row"><button class="btn sm" data-act="cargarEj">Cargar ejemplos</button><button class="btn sm danger" data-act="borrarEj"'+(ej?'':' disabled')+'>Borrar ejemplos</button></div></section>'
   +'<section class="card stack"><h3>Permisos</h3><p class="small muted">Para que tus usuarios de prueba publiquen y den su opinión, compártele la página con el nivel “Colaborador”. Con enlace público de solo lectura verán la demostración sin guardar datos.</p></section>';
}

var NAV=[['inicio','Casos',IC.lista],['mapa','Mapa',IC.mapa],['publicar','Publicar',IC.mas,'pub'],['alertas','Alertas',IC.alerta],['mas','Más',IC.menu]];

    var rows=[cols.join(',')].concat(store.opiniones.map(function(o){var t=o.tareas||{};return [o.creadoEn,o.rol,t.publicar?1:0,t.buscar?1:0,t.avistamiento?1:0,t.cerrar?1:0,o.claridad,o.confianza,o.utilidad,o.alertas,o.usaria,o.comentario].map(csvCell).join(',')}));
    try{
      var blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='opiniones-reencuentro-seguro.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      toast('Archivo descargado');

document.addEventListener('submit',async function(e){
  var form=e.target;if(!form.getAttribute||!form.getAttribute('data-form'))return;

function enlazarBotonPublicacion(){
  var form=$('#fpub');if(!form)return;
  var btn=form.querySelector('button[type=submit]');if(!btn)return;
  btn.dataset.linked='1';
}

/* aviso flotante */
var toastTimer=null;
function toast(msg){
  var el=$('#toast');if(!el)return;
  el.textContent=msg;el.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.hidden=true},4000);
}
/* error visible junto al campo; devuelve undefined para poder usar "return err(...)" */
function err(form,msg,campo){
  form.querySelectorAll('.err-msg').forEach(function(n){n.remove()});
  var inp=campo?form.querySelector('[name="'+campo+'"]'):null;
  if(inp){
    var cont=inp.closest('.field')||inp.closest('label')||inp.parentNode;
    var s=document.createElement('span');
    s.className='hint err-msg';s.setAttribute('role','alert');s.style.color='var(--lost)';s.style.fontWeight='600';s.textContent=msg;
    cont.appendChild(s);
    try{inp.focus()}catch(e){}
  }
  toast(msg);
}
/* reduce la foto (máx. 900 px, JPEG) antes de guardarla */
function comprimir(file){
  return new Promise(function(ok,fail){
    if(!file||!/^image\//.test(file.type))return fail(new Error('No es una imagen'));
    var fr=new FileReader();
    fr.onerror=function(){fail(new Error('No se pudo leer'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){fail(new Error('Imagen no válida'))};
      img.onload=function(){
        var max=900,w=img.width,h=img.height,k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg',0.75));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function fd(form){
  var o={};
  new FormData(form).forEach(function(v,k){if(typeof v==='string')o[k]=v});
  return o;
}

async function manejarSubmit(form){
  var kind=form.getAttribute('data-form'),d=fd(form),btn=form.querySelector('button[type=submit]');
  if(btn&&btn.disabled)return;
  try{
    if(btn)btn.disabled=true;
    toast(kind==='publicar'?'Guardando reporte...':'Guardando cambios...');
    if(kind==='publicar')await enviarPublicar(form,d);
    else if(kind==='avist')await enviarAvist(form,d);
    else if(kind==='contacto')await enviarContacto(form,d);
    else if(kind==='estado')await enviarEstado(form,d);
    else if(kind==='opinion')await enviarOpinion(form,d);
    else if(kind==='prefs')guardarPrefs(form);
  }catch(x){toast(errMsg(x))}
  finally{if(btn&&document.body.contains(btn))btn.disabled=false}
}

async function enviarPublicar(form,d){
  var t=d.tipo||'perdida',faltan=[],campos=[];
  if(!d.color){faltan.push('color');campos.push('color')}
  if(!d.fecha){faltan.push('fecha');campos.push('fecha')}
  else if(d.fecha>hoy()){faltan.push('fecha futura');campos.push('fecha')}
  if(d.municipio==='Armenia'&&!d.sector&&!d.barrio){faltan.push('sector o barrio');campos.push('sector')}
  if(t!=='avistamiento'&&!telOk(d.contacto)){faltan.push('celular válido (10 dígitos, empieza por 3)');campos.push('contacto')}
  if(!d.acepto){faltan.push('casilla de autorización');campos.push('acepto')}
  if(faltan.length){err(form,'Falta completar: '+faltan.join(', '),campos[0]);return}
  var now=nowISO(),id=nid();
  if(t==='avistamiento'){
    var a={id:id,casoId:null,especie:d.especie,color:d.color,tamano:d.tamano||'',nota:(d.senas||'').trim(),municipio:d.municipio,sector:d.municipio==='Armenia'?d.sector:'',barrio:(d.barrio||'').trim(),fecha:d.fecha,hora:d.hora||'',creadoPor:store.uid,creadoEn:now};
    await putAv(a);
    ui.result={ref:'vista-'+id,pendiente:false};
  }else{
    var estado=t==='encontrada'&&d.resguardo?'resguardo':'nuevo';
    var c={id:id,tipo:t,especie:d.especie,nombre:t==='perdida'?(d.nombre||'').trim():'',color:d.color,tamano:d.tamano||'',senas:(d.senas||'').trim(),municipio:d.municipio,sector:d.municipio==='Armenia'?d.sector:'',barrio:(d.barrio||'').trim(),
      fecha:d.fecha,hora:d.hora||'',foto:ui.pubFoto||null,estado:estado,moderacion:cloud()?'pendiente':'aprobado',creadoPor:store.uid,creadoEn:now,historial:[{estado:estado,ts:now,nota:'Reporte publicado'}]};
    await putCaso(c);
    var q=[];
    q.push(putBuzon({tipo:'contacto',casoId:id,contacto:digits(d.contacto)}));
    await Promise.all(q);
    if(t==='perdida'&&(d.privada||'').trim())await putBuzon({tipo:'senaPrivada',casoId:id,texto:d.privada.trim()});
    ui.result={ref:'caso-'+id,pendiente:c.moderacion==='pendiente'};
  }
  ui.pubFoto=null;
  render();window.scrollTo(0,0);
}
async function enviarAvist(form,d){
  if(!d.sector&&!(d.barrio||'').trim())return err(form,'Indica el sector donde la viste.','sector');if(d.fecha&&d.fecha>hoy())return err(form,'La fecha no puede ser futura.','fecha');
  var c=store.casos.filter(function(x){return x.id===d.casoId})[0];if(!c)return;
  var now=nowISO();
  await putAv({id:nid(),casoId:c.id,especie:c.especie,color:c.color,tamano:c.tamano||'',nota:(d.nota||'').trim(),municipio:c.municipio,sector:d.sector,barrio:(d.barrio||'').trim(),fecha:d.fecha||hoy(),hora:d.hora||'',creadoPor:store.uid,creadoEn:now});
  if(c.estado==='nuevo'||c.estado==='en_busqueda'){
    var h=(c.historial||[]).concat([{estado:'avistamiento',ts:now,nota:'Avistamiento reportado en '+(d.sector||'la zona')}]);
    try{await putCaso(Object.assign({},c,{estado:'avistamiento',historial:h}))}catch(e){}
  }
  ui.form=null;toast('Avistamiento registrado. ¡Gracias por ayudar!');render(true);
}
async function enviarContacto(form,d){
  if(!(d.mensaje||'').trim())return err(form,'Escribe tu mensaje.','mensaje');
  if(!telOk(d.contacto))return err(form,'Escribe un celular colombiano válido de 10 dígitos.','contacto');
  if(!d.acepto)return err(form,'Debes autorizar el uso de tu celular.','acepto');
  await putBuzon({tipo:'mensaje',casoId:d.casoId,texto:d.mensaje.trim(),contacto:digits(d.contacto)});
  ui.form=null;toast('Mensaje enviado al moderador. Te contactarán si hay novedades.');render(true);
}
async function enviarEstado(form,d){
  var c=store.casos.filter(function(x){return x.id===d.id})[0];if(!c)return;
  if(d.estado==='reunido'&&!(d.v1&&d.v2&&d.v3))return err(form,'Confirma las tres verificaciones antes de marcar el reencuentro.','v1');
  var h=(c.historial||[]).concat([{estado:d.estado,ts:nowISO(),nota:(d.nota||'').trim()}]);
  await putCaso(Object.assign({},c,{estado:d.estado,historial:h}));
  ui.form=null;toast('Caso actualizado');render(true);
}
async function enviarOpinion(form,d){
  if(!d.claridad||!d.confianza||!d.utilidad)return err(form,'Responde las tres preguntas con escala del 1 al 5.');
  var o={rol:d.rol||'otro',tareas:{publicar:!!d.t_publicar,buscar:!!d.t_buscar,avistamiento:!!d.t_avistamiento,cerrar:!!d.t_cerrar},claridad:+d.claridad,confianza:+d.confianza,utilidad:+d.utilidad,alertas:d.alertas||'',usaria:d.usaria||'',comentario:(d.comentario||'').trim().slice(0,500),creadoPor:store.uid,creadoEn:nowISO()};
  await putOpinion(o);
  toast('¡Gracias! Tu opinión nos ayuda a mejorar.');location.hash='#mas';
}
function guardarPrefs(form){
  var sec=[],esp=[];
  form.querySelectorAll('input[name=sec]:checked').forEach(function(i){sec.push(i.value)});
  form.querySelectorAll('input[name=esp]:checked').forEach(function(i){esp.push(i.value)});
  if(!esp.length)return toast('Elige al menos una especie.');
  prefs.sectores=sec;prefs.especies=esp;LSset('rs_prefs_v1',prefs);toast('Preferencias guardadas');render(true);
}

boot();
